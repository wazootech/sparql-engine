<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}{{ site.lang | default: "
  en" }}{% endif %}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {%- if page.title -%}{{ page.title }} · {{ site.title }}{%- else -%}{{ site.title }}{%- endif -%}
    </title>
    <meta
      name="description"
      content="{%- if page.description -%}{{ page.description }}{%- else -%}{{ site.description }}{%- endif -%}"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ site.baseurl }}/assets/favicon.svg"
    >
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <a class="logo" href="{{ site.baseurl }}/" aria-label="Wiki index">
            <img
              class="logo-image"
              src="{{ site.baseurl }}/assets/wazoo.svg"
              alt="Wazoo logo"
              width="40"
              height="40"
            >
          </a>
          <div class="brand-text">
            <p class="eyebrow">Developer Wiki</p>
            <p
              class="wordmark">Wazoo <span class="accent">SPARQL&nbsp;Engine</span></p>
          </div>
        </div>

        <nav class="nav" aria-label="Wiki pages">
          {% for entry in site.data.navigation %}
            <a
              class="nav-link{% if page.url == entry.url %} active{% endif %}"
              href="{{ site.baseurl }}{{ entry.url }}"
            >
              <span class="nav-num">{{ entry.num }}</span>{{ entry.title }}
            </a>
          {% endfor %}
        </nav>

        <div class="sidebar-foot">
          <a
            class="repo-link"
            href="https://github.com/wazootech/sparql-engine"
            target="_blank"
            rel="noopener noreferrer"
          >github.com/wazootech/sparql-engine</a>
        </div>
      </aside>

      <main class="content">
        {{ content }}
        {% include prev-next.html %}
      </main>
    </div>
  </body>
</html>
