name: code-health
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File length (enforced; 120 src / 300 test, blank/comment/import lines excluded)
        run: |
          # Allowlist: files that cannot be split without a behavior change or
          # that are generated. It may only shrink; add nothing to it.
          allowed() {
            case "$1" in
              # Single large classes; their methods share private state and
              # hot paths, so splitting would add indirection or change behavior.
              src/evaluator/expression-evaluator.ts|src/evaluator/bgp-evaluator.ts|src/evaluator/update-evaluator.ts|src/evaluator/sparql-evaluator.ts|src/store/memory-stream.ts|src/store/memory-store.ts) return 0;;
              # Single generator functions (property-path step expansion), ~235 lines each.
              src/evaluator/path-steps.ts|src/evaluator/path-steps-sync.ts) return 0;;
              # Mutually recursive AST type declarations; no runtime code.
              src/parser/ast.ts) return 0;;
              # Build tooling, not published (excluded in deno.json).
              src/parser/generate-parser.ts) return 0;;
              # W3C test runner: one class with shared state.
              test/w3c/runner.ts) return 0;;
              # Benchmark and size-measurement scripts with top-level run order.
              bench/engine_bench.ts|bench/treemap.ts|bench/latency-chart.ts|bench/measure-libs.ts|bench/budget.ts|bench/memory-probe.ts) return 0;;
            esac
            return 1
          }
          status=0
          for f in $(git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -vE '(^|/)(node_modules|dist|generated|fixtures|\.next)/|\.d\.ts$|\.gen\.|openapi|snapshot|schema|^src/parser/(parser|turtle-generated)\.ts$|^playground/app\.js$'); do
            n=$(awk -f .github/scripts/code-lines.awk "$f")
            case "$f" in *.test.*|*.spec.*|*/tests/*|tests/*|test/*|*-test-helpers.*) max=300;; *) max=120;; esac
            if [ "$n" -gt "$max" ] && ! allowed "$f"; then
              echo "::error file=$f::$n lines of code (limit $max)"
              echo "- \`$f\`: $n (limit $max)" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit $status
      - name: TODO/FIXME without an issue link (warn-only)
        run: |
          git grep -nE '\b(TODO|FIXME)\b' -- '*.ts' '*.tsx' '*.js' '*.mjs' ':!*generated*' ':!src/parser/parser.ts' ':!playground/app.js' \
            | grep -vE '#[0-9]+|/issues/[0-9]+' \
            | while IFS=: read -r f l _; do echo "::warning file=$f,line=$l::TODO/FIXME without an issue link"; done || true
