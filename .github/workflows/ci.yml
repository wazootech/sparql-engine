name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task ci
      # Explicit step (not just a deno task ci dependency) so the Oxigraph
      # EXISTS gate runs even if the ci task's dependency list changes.
      - run: deno task test:exists-ref
      - run: deno task publish:dry
  # The committed bench/latency-data.json snapshot must match the current
  # bench suite — otherwise the published latency chart shows a stale query
  # inventory. Timings are machine-specific and never compared; the bench
  # inventory (group/name/baseline) is deterministic, so a fresh run must
  # match it. Runs only when the suite or snapshot could have changed
  # (bench:latency:check; BENCH_INVENTORY=1 runs each bench once, no warmup).
  latency-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Path-gated: only bench-touching PRs pay for the (inventory-mode) run.
      - uses: dorny/paths-filter@v3
        id: bench-changed
        with:
          filters: |
            bench:
              - 'bench/engine_bench.ts'
              - 'bench/latency-data.json'
      - if: steps.bench-changed.outputs.bench == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: steps.bench-changed.outputs.bench == 'true'
        run: deno task bench:latency:check
  # Wiki link-rot gate: every external markdown link in the wiki (README.md +
  # docs/*.md) must resolve — JSR doc pages, GitHub blob/issues, spec TRs.
  # Hard-fails on 404/410 only, so a transient host outage never false-reds
  # the build. Runs only when the wiki or the check itself changes.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: docs-changed
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - '.github/workflows/ci.yml'
      - if: steps.docs-changed.outputs.docs == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: steps.docs-changed.outputs.docs == 'true'
        run: deno task docs:link-check
  # W3C differential gate: wazoo must agree with comunica on the vendored
  # SPARQL 1.1 evaluation-core suite. The pass rate is the tracked progress
  # metric — this job goes green only on a full pass (345/345): wazoo agrees
  # with comunica, or matches the W3C reference where comunica is wrong.
  w3c-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test:w3c
      # Oxigraph EXISTS differential gate, tracked alongside the W3C
      # conformance checks so a subquery-in-EXISTS regression fails here too.
      - run: deno task test:exists-ref
